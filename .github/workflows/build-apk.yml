name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: 4. Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: 5. NDK + CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: 6. Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 7. Clone SDL2 + Java/Res
        run: |
          git clone --depth 1 --branch release-2.30.x \
            https://github.com/libsdl-org/SDL.git app/src/main/jni/SDL
          mkdir -p app/src/main/java/org/libsdl/app app/src/main/res
          cp -r app/src/main/jni/SDL/android-project/app/src/main/java/org/libsdl/app/. \
                app/src/main/java/org/libsdl/app/
          cp -r app/src/main/jni/SDL/android-project/app/src/main/res/. \
                app/src/main/res/

      - name: 8. Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 9. Upload
        uses: actions/upload-artifact@v4
        with:
          name: ClayMaterial-debug
          path: app/build/outputs/apk/debug/app-debug.apk
